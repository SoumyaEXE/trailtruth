# Render Blueprint for the TrailTruth backend.
# (Render reads render.yaml from the repo root - copy/symlink this file there, or point the Blueprint at it.)
#
# HONEST TRADEOFFS
# - Temporal needs a server. Production = Temporal Cloud (or self-hosted Temporal) + a separate worker.
# - For the hackathon demo we use OPTION A: ONE web service that runs `python -m agent.dev`, i.e. the
#   Temporal CLI dev server (SQLite on the container's ephemeral disk) + worker + FastAPI in one container.
#   Workflows survive *worker* crashes (that's the demo), but NOT a redeploy/restart of the container:
#   the dev-server DB lives on ephemeral disk. Free instances also sleep when idle (cold start ~1 min,
#   which includes downloading the ~160 MB Temporal CLI on first boot).
#   If Temporal is unreachable the API still answers: /api/alerts|parks|eval serve cached data/fixtures and
#   POST /api/cards falls back to an inline (non-durable, clearly labelled) run.
# - OPTION B (real durability): set TEMPORAL_ADDRESS/NAMESPACE/API_KEY to Temporal Cloud, change the web
#   startCommand to `python -m agent.dev --no-server --no-worker`, and enable the worker service below
#   (Render background workers need a paid instance type).
services:
  - type: web
    name: trailtruth-api
    runtime: python
    plan: starter            # free works too, but sleeps; 512 MB is tight for dev server + worker + API
    rootDir: .
    buildCommand: pip install -r agent/requirements.txt
    # OPTION A (demo): dev server + worker + API in one container. $PORT is provided by Render.
    startCommand: python -m agent.dev --host 0.0.0.0 --api-port $PORT --refresh
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: TRAILTRUTH_MODEL_PROVIDER
        value: heuristic     # tinker | openai once ml/infer.py + keys are configured
      - key: NPS_API_KEY
        sync: false          # set in the Render dashboard; never commit it
      - key: SENTRY_DSN
        sync: false
      - key: TRAILTRUTH_CORS_ORIGINS
        value: ""            # extra exact origins; *.vercel.app and *.onrender.com are allowed by default
      # OPTION B (Temporal Cloud):
      # - key: TEMPORAL_ADDRESS
      #   value: <namespace>.<account>.tmprl.cloud:7233
      # - key: TEMPORAL_NAMESPACE
      #   value: <namespace>.<account>
      # - key: TEMPORAL_API_KEY
      #   sync: false

  # OPTION B only - durable worker against Temporal Cloud (paid instance type).
  # - type: worker
  #   name: trailtruth-worker
  #   runtime: python
  #   plan: starter
  #   buildCommand: pip install -r agent/requirements.txt
  #   startCommand: python -m agent.worker
  #   envVars:
  #     - key: PYTHON_VERSION
  #       value: 3.12.7
  #     - key: TEMPORAL_ADDRESS
  #       value: <namespace>.<account>.tmprl.cloud:7233
  #     - key: TEMPORAL_NAMESPACE
  #       value: <namespace>.<account>
  #     - key: TEMPORAL_API_KEY
  #       sync: false
  #     - key: NPS_API_KEY
  #       sync: false

  # Weekly refresh of /api/alerts + /api/parks (cron jobs need a paid plan; or run `python -m agent.refresh`
  # from the web service on boot). The Friday 07:00 TrailCard itself is a Temporal Schedule:
  #   python -m agent.schedule create --parks havo chch
