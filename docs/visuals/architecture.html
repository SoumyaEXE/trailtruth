<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TrailTruth architecture</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=JetBrains+Mono:wght@400;500;600;700&family=Zilla+Slab:wght@600;700&display=block" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style> .chart { margin-top: 20px; } </style>
</head>
<body>
<div id="frame">
  <div class="kicker">How it works · what runs where</div>
  <h1>The big model teaches once. The small model works every week. The rangers grade.</h1>
  <div class="chart" id="chart"></div>
  <div class="src"><span>Numbers: ml/results/*.json · retry policies: agent/ (Temporal activities)</span><span class="brand">TrailTruth</span></div>
</div>
<script src="data.js"></script>
<script src="common.js"></script>
<script>
(function () {
  const M = TT.models, T = TT.train, S = TT.spend.stages;
  const W = 718, H = 554;
  const INK = "#1e1c19", INK2 = "#5b544b", INK3 = "#786f64";
  const TAG = {
    "NPS API": ["#f6ece0", "#7a5a32"], "TINKER": ["#e3eef7", "#245a85"],
    "WORKER": ["#e4f2e8", "#145233"], "PAPER": ["#f4f2ed", "#5b544b"],
  };
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Pipeline: NPS API ${TT.spend.teacher_rows} alerts, teacher Qwen3.5-397B labels, Tinker LoRA SFT, Qwen3.5-4B student; weekly Temporal workflow fetch_alerts, classify_alert, compose_card, publish_card, producing one printed card.">`;
  s += `<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" fill="#5b544b"/></marker>
        <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" fill="#2f7f56"/></marker>
        <marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" fill="#7a5a32"/></marker></defs>`;
  const T_ = (x, y, txt, o = {}) => `<text x="${x}" y="${y}" font-size="${o.size || 12}" font-weight="${o.w || 400}" fill="${o.fill || INK}" ${o.anchor ? `text-anchor="${o.anchor}"` : ""} ${o.mono ? 'font-family="JetBrains Mono, monospace"' : ""} ${o.ls ? `letter-spacing="${o.ls}"` : ""}>${txt}</text>`;
  function box(x, y, w, h, tag, title, lines, o = {}) {
    const [tb, tf] = TAG[tag];
    let g = `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="#ffffff" stroke="${o.hi ? "#2f7f56" : "#d5cfc4"}" stroke-width="${o.hi ? 1.6 : 1}"/>`;
    const tw = tag.length * 6.4 + 12;
    g += `<rect x="${x + 10}" y="${y + 10}" width="${tw}" height="16" rx="3" fill="${tb}"/>`;
    g += T_(x + 16, y + 21.5, tag, { size: 9.5, w: 700, fill: tf, mono: true, ls: "0.04em" });
    g += T_(x + 10, y + 44, title, { size: o.titleSize || 13.5, w: 650, mono: o.monoTitle });
    lines.forEach((l, i) => { g += T_(x + 10, y + 61 + i * 15.5, l, { size: 11.5, fill: i === lines.length - 1 && o.lastStrong ? INK : INK2, w: i === lines.length - 1 && o.lastStrong ? 600 : 400 }); });
    return g;
  }
  const arrow = (x1, y1, x2, y2, label, o = {}) => {
    let g = `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${o.col || "#5b544b"}" stroke-width="1.4" ${o.dash ? 'stroke-dasharray="4 3"' : ""} marker-end="url(#${o.marker || "ah"})"/>`;
    if (label) g += T_((x1 + x2) / 2, Math.min(y1, y2) - 6 + (o.dy || 0), label, { size: 10.5, fill: INK3, anchor: "middle" });
    return g;
  };
  // ---------- zone A ----------
  const zA = 0, zAh = 306;
  s += `<rect x="0" y="${zA}" width="${W}" height="${zAh}" rx="10" fill="#f4f2ed"/>`;
  s += T_(14, zA + 22, "ONCE · OFFLINE DISTILLATION", { size: 11, w: 700, fill: "#245a85", ls: "0.06em" });
  s += T_(W - 14, zA + 22, `$${TT.spend.total.toFixed(2)} all-in`, { size: 11.5, w: 600, fill: INK2, anchor: "end", mono: true });
  const by = 38, bh = 120, bws = [128, 140, 140, 168];
  const g = (W - 28 - bws.reduce((a, b) => a + b, 0)) / 3;
  const bxs = []; { let a = 14; bws.forEach(w => { bxs.push(a); a += w + g; }); }
  const bx = i => bxs[i];
  s += box(bx(0), by, bws[0], bh, "NPS API", "NPS alerts", [`${TT.spend.teacher_rows} live alerts`, "270+ parks", "title + description"]);
  s += box(bx(1), by, bws[1], bh, "TINKER", "Teacher", ["Qwen3.5-397B-A17B", "labels each alert", `${TT.spend.teacher_rows}/${TT.spend.teacher_rows} valid JSON`, `$${S.teacher_label.usd.toFixed(2)}`], { lastStrong: true });
  s += box(bx(2), by, bws[2], bh, "TINKER", "LoRA SFT", [`rank ${T.rank} · ${T.steps} steps`, `${T.train_examples} train alerts`, `${Math.floor(T.wall_seconds / 60)} m ${Math.round(T.wall_seconds % 60)} s`, `$${S.train_tinker.usd.toFixed(2)}`], { lastStrong: true });
  s += box(bx(3), by, bws[3], bh, "TINKER", "Student", ["Qwen3.5-4B", "+ TrailTruth LoRA", "", `$${M.lora.cost_per_1k_alerts_usd.toFixed(2)} per 1k alerts`], { hi: true, lastStrong: true });
  const ay = by + bh / 2;
  for (let i = 0; i < 3; i++) s += arrow(bx(i) + bws[i] + 3, ay, bx(i + 1) - 3, ay);
  // ranger strip
  const ry = 216, rh = 74;
  s += `<rect x="${bx(0)}" y="${ry}" width="${bws[0] + 30}" height="${rh}" rx="8" fill="#fbf7f0" stroke="#c49a6c" stroke-dasharray="4 3"/>`;
  s += T_(bx(0) + 10, ry + 21, "Ranger's category", { size: 13, w: 650 });
  s += T_(bx(0) + 10, ry + 38, "Info · Caution ·", { size: 11.5, fill: INK2 });
  s += T_(bx(0) + 10, ry + 53, "Danger · Park Closure", { size: 11.5, fill: INK2 });
  s += T_(bx(0) + 10, ry + 67, "never shown to a model", { size: 11, fill: "#7a5a32", w: 600 });
  const midX12 = (bx(1) + bws[1] + bx(2)) / 2;
  const ryMid = ry + rh / 2;
  s += `<path d="M${bx(0) + bws[0] + 30},${ryMid} H${midX12} V${ay + 9}" fill="none" stroke="#7a5a32" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ahp)"/>`;
  s += T_(midX12 + 8, by + bh + 22, `fixes 235 of ${TT.spend.teacher_rows}`, { size: 10.5, fill: "#7a5a32", w: 600 });
  s += T_(midX12 + 8, by + bh + 36, "teacher decisions", { size: 10.5, fill: "#7a5a32", w: 600 });
  // eval box under student (shifted right so the student's output line can pass on its left)
  const ex = bx(3) + 26, ew = bws[3] - 26, eh = rh;
  s += `<path d="M${midX12},${ryMid} H${ex - 3}" fill="none" stroke="#7a5a32" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ahp)"/>`;
  s += T_((midX12 + ex) / 2 - 8, ryMid - 7, `grades ${TT.test_size} held-out`, { size: 10.5, fill: "#7a5a32", anchor: "middle", w: 600 });
  s += `<rect x="${ex}" y="${ry}" width="${ew}" height="${eh}" rx="8" fill="#ffffff" stroke="#d5cfc4"/>`;
  s += T_(ex + 10, ry + 21, "Eval", { size: 13, w: 650 });
  s += T_(ex + 10, ry + 39, `accuracy ${M.base.decision_acc.toFixed(3)} → ${M.lora.decision_acc.toFixed(3)}`, { size: 11, fill: INK2 });
  s += T_(ex + 10, ry + 56, `no-go: ${TT.nogo_row.base[2]} → ${TT.nogo_row.lora[2]} of ${TT.nogo_total.lora}`, { size: 11, fill: INK, w: 600 });
  // ---------- zone B ----------
  const zB = zAh + 40;
  const cy = zB + 42, ch = 88;
  const ws = [146, 152, 124, 112, 118], gap = (W - 28 - ws.reduce((a, b) => a + b, 0)) / 4;
  const cx = []; { let a = 14; ws.forEach(w => { cx.push(a); a += w + gap; }); }
  const ry2 = cy + ch + 12, zBh = (ry2 + 3 * 15 + 12 + 14) - zB;
  s += `<rect x="0" y="${zB}" width="${W}" height="${zBh}" rx="10" fill="#eef6f1"/>`;
  s += T_(14, zB + 22, "EVERY FRIDAY 07:00", { size: 11, w: 700, fill: "#145233", ls: "0.06em" });
  s += T_(W - 14, zB + 22, "Temporal Schedule → TrailCardWorkflow, on the Temporal worker", { size: 11.5, w: 500, fill: INK2, anchor: "end" });
  s += box(cx[0], cy, ws[0], ch, "WORKER", "fetch_alerts", ["× N parks, parallel", "NPS API (live)"], { monoTitle: true, titleSize: 13 });
  s += box(cx[1], cy, ws[1], ch, "WORKER", "classify_alert", ["× M alerts, 6 at a time", "calls the student"], { monoTitle: true, titleSize: 13, hi: true });
  s += box(cx[2], cy, ws[2], ch, "WORKER", "compose_card", ["worst decision", "per park"], { monoTitle: true, titleSize: 13 });
  s += box(cx[3], cy, ws[3], ch, "WORKER", "publish_card", ["atomic write", "JSON + API"], { monoTitle: true, titleSize: 13 });
  for (let i = 0; i < 4; i++) s += arrow(cx[i] + ws[i] + 2, cy + ch / 2, cx[i + 1] - 3, cy + ch / 2);
  // printed card
  const px = cx[4] + 10, pw = ws[4] - 18, py = cy - 4, ph = ch + 6;
  s += `<g transform="rotate(-3 ${px + pw / 2} ${py + ph / 2})">`;
  s += `<rect x="${px + 2}" y="${py + 3}" width="${pw}" height="${ph}" rx="3" fill="#1e1c19" opacity="0.10"/>`;
  s += `<rect x="${px}" y="${py}" width="${pw}" height="${ph}" rx="3" fill="#fbf8f1" stroke="#d5cfc4"/>`;
  s += `<rect x="${px}" y="${py}" width="${pw}" height="16" rx="3" fill="#1f3d2c"/><rect x="${px}" y="${py + 10}" width="${pw}" height="6" fill="#1f3d2c"/>`;
  s += T_(px + 7, py + 11.5, "TRAILTRUTH", { size: 7.5, w: 700, fill: "#f1ede4", mono: true, ls: "0.08em" });
  [["no_go", "NO-GO"], ["caution", "CAUTION"], ["go", "GO"]].forEach(([k, lab], i) => {
    const yy = py + 31 + i * 21;
    s += TTV.shape(k, px + 13, yy, 5, "fill");
    s += T_(px + 23, yy + 3.5, lab, { size: 9, w: 700, mono: true, fill: INK });
    s += `<rect x="${px + 23}" y="${yy + 7}" width="${pw - 34}" height="2.5" rx="1" fill="#d5cfc4"/>`;
  });
  s += `</g>`;
  s += T_(cx[4] + ws[4] / 2 + 2, ry2 + 18, "one printed card,", { size: 12, w: 650, anchor: "middle" });
  s += T_(cx[4] + ws[4] / 2 + 2, ry2 + 34, "then the app", { size: 12, w: 400, fill: INK2, anchor: "middle" });
  s += T_(cx[4] + ws[4] / 2 + 2, ry2 + 49, "stops talking", { size: 12, w: 400, fill: INK2, anchor: "middle" });
  const badge = (x, w, lines) => {
    let gg = `<rect x="${x}" y="${ry2}" width="${w}" height="${3 * 15 + 12}" rx="6" fill="#ffffff" stroke="#a9d4b8"/>`;
    lines.forEach((l, i) => { gg += T_(x + 8, ry2 + 19 + i * 15, l, { size: 10.5, fill: i === 0 ? "#145233" : INK2, w: i === 0 ? 650 : 400 }); });
    return gg;
  };
  s += badge(cx[0], ws[0], ["↻ 6 attempts, 1 s → 20 s", "429 → cache / snapshot,", "not retried"]);
  s += badge(cx[1], ws[1], ["↻ 5 s heartbeat timeout", "retry on hang / bad JSON", "5th try → heuristic"]);
  s += badge(cx[2], ws[2], ["deterministic", "no model call"]);
  s += badge(cx[3], ws[3], ["single write", "of the card file"]);
  // student → classify_alert
  const lx = bx(3) + 12, hy = zAh + 20, dropX = cx[1] + ws[1] / 2;
  s += `<path d="M${lx},${by + bh} V${hy} H${dropX} V${cy - 3}" fill="none" stroke="#2f7f56" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ahg)"/>`;
  s += T_(dropX + 10, hy - 6, "LoRA via Tinker (or a local server)", { size: 11, w: 600, fill: "#145233" });
  s += `</svg>`;
  document.getElementById("chart").innerHTML = s;
})();
</script>
</body>
</html>
